cv:
  name: Adriana-Stefania Ciupeanu
  label: Statistician, Scientific Machine-Learning Researcher, and Mathematical Modeller
  summary: Bayesian inference, neural surrogate modelling, network science, and reproducible software for complex biological and health systems.
  website: https://cadrianas.github.io
  social_networks:
    - network: GitHub
      username: cadrianas

  sections:
    Experience:
      - company: University of Manitoba
        position: Postdoctoral Fellow, Department of Mathematics
        location: Winnipeg, MB, Canada
        start_date: 2026-05
        end_date: 2026-10
        highlights:
          - Lead the machine-learning extension of a global metapopulation model for forecasting pathogen-importation risk across 238 countries and territories.
          - Conceived a mechanistically informed neural-surrogate methodology for likelihood-free Bayesian inference and probabilistic forecasting.
          - Designed temporally conditioned neural surrogates and comparative graph-attention and recurrent models using transportation-network and location-level features.
          - Built an end-to-end Python pipeline for simulation, sampling, PyTorch training, SMC-ABC inference, uncertainty propagation, validation, and benchmarking.

      - company: University of Manitoba
        position: Instructor, Mathematical Skills (MSKL 0100)
        location: Winnipeg, MB, Canada
        start_date: 2025-09
        end_date: 2025-12
        highlights:
          - Held full responsibility for course delivery, assessment design, grading, learning materials, feedback, and student support.
          - Nominated for the Extended Education Instructor Excellence Award in 2026.

      - company: University of Manitoba
        position: Lead Teaching Assistant and Guest Lecturer, Mathematics of Data Science
        location: Winnipeg, MB, Canada
        start_date: 2023
        end_date: 2025
        highlights:
          - Delivered guest lectures on graph theory and network science and developed the associated teaching materials.
          - Led grading of programming assignments and contributed datasets and revisions to course assessments.

      - company: University of Manitoba
        position: Undergraduate Research Mentor
        location: Winnipeg, MB, Canada
        start_date: 2026
        end_date: present
        highlights:
          - Guide development of a hybrid gravity-graph neural network model of inter-city mobility for spatial epidemic modelling.
          - Provide methodological direction in graph neural networks, mobility modelling, experimental design, validation, and research communication.

    Education:
      - institution: University of Manitoba
        area: Interdisciplinary Individual Studies - Mathematics and Statistics
        degree: PhD
        start_date: 2019
        end_date: 2026
        location: Winnipeg, MB, Canada
        highlights:
          - "Supervisors: Dr. Julien Arino and Dr. Saman Muthukumarana"
          - "Dissertation: Mathematical and statistical modelling during a pandemic event"

      - institution: University of Manitoba
        area: Mathematics
        degree: Master of Science
        start_date: 2016
        end_date: 2020
        location: Winnipeg, MB, Canada

      - institution: Queen's University
        area: Mathematics and Statistics
        degree: Master of Science (Course-Based)
        start_date: 2015
        end_date: 2016
        location: Kingston, ON, Canada

      - institution: Oxford Brookes University
        area: Mathematics
        degree: Bachelor of Science (Honours)
        start_date: 2012
        end_date: 2015
        location: Oxford, UK

    Publications:
